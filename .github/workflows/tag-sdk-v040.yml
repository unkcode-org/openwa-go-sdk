name: Publish SDK v0.4.0 tag
on:
  push:
    branches: [codex/tag-sdk-v0.4.0]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag verified SDK commit
        run: |
          set -eu
          target=e60260c3cb52af4f21c0775c2c758245db2858be
          test "$(git rev-parse origin/main)" = "$target"
          if git rev-parse -q --verify refs/tags/v0.4.0 >/dev/null; then
            test "$(git rev-parse refs/tags/v0.4.0^{commit})" = "$target"
          else
            git tag v0.4.0 "$target"
            git push origin refs/tags/v0.4.0
          fi
